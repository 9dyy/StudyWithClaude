<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게임 수학 강의 · 언리얼 C++ 클라이언트 개발자용</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#0b0e1a;--bg2:#11152a;--card:#161b33;--card2:#1c2243;--line:#2a3157;
  --txt:#e7ecff;--dim:#9aa3c7;--faint:#6b73a0;
  --ind:#6366f1;--ind2:#818cf8;--pur:#a855f7;--cyan:#22d3ee;
  --grn:#34d399;--red:#f87171;--amber:#fbbf24;--orange:#fb923c;
  --shadow:0 10px 40px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Pretendard',system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}

#bar{position:fixed;top:0;left:0;height:3px;width:0;z-index:99;background:linear-gradient(90deg,var(--grn),var(--cyan),var(--pur))}
nav{position:fixed;top:0;left:0;right:0;height:56px;z-index:80;background:rgba(11,14,26,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center}
nav .wrap{display:flex;align-items:center;gap:14px;width:100%}
nav .logo{font-weight:800;letter-spacing:-.02em}nav .logo b{color:var(--grn)}
nav .chips{display:flex;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav .chips::-webkit-scrollbar{display:none}
nav a.chip{font-size:12.5px;color:var(--dim);text-decoration:none;padding:6px 11px;border-radius:20px;white-space:nowrap;transition:.15s;border:1px solid transparent}
nav a.chip:hover{color:var(--txt);background:var(--card)}
nav a.chip.on{color:#04221a;background:var(--grn);border-color:var(--grn)}

header.hero{padding:110px 0 40px;position:relative;overflow:hidden;text-align:center}
header.hero::before{content:"";position:absolute;top:-140px;left:50%;transform:translateX(-50%);width:800px;height:460px;background:radial-gradient(ellipse,rgba(52,211,153,.2),transparent 70%);filter:blur(20px);z-index:-1}
.kicker{display:inline-block;font-size:13px;font-weight:700;color:var(--grn);background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.3);padding:6px 14px;border-radius:30px;margin-bottom:20px}
header.hero h1{font-size:clamp(32px,6vw,52px);line-height:1.14;letter-spacing:-.03em;font-weight:800}
header.hero h1 .g{background:linear-gradient(120deg,var(--grn),var(--cyan),var(--pur));-webkit-background-clip:text;background-clip:text;color:transparent}
header.hero p.sub{color:var(--dim);font-size:17px;margin:18px auto 0;max-width:600px}

.overall{max-width:560px;margin:30px auto 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow)}
.overall .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.overall .top .t{font-size:14px;font-weight:700}
.overall .top .n{font-family:ui-monospace,monospace;font-size:13px;color:var(--dim)}
.overall .pbar{height:12px;background:var(--bg2);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.overall .pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--grn),var(--cyan));transition:1s}
.overall .stats{display:flex;gap:20px;justify-content:center;margin-top:16px;font-size:13px;color:var(--dim);flex-wrap:wrap}
.overall .stats b{color:var(--txt);font-family:ui-monospace,monospace}

.part{padding:36px 0 8px;border-top:1px solid var(--line);margin-top:24px}
.part:first-of-type{border-top:none}
.part-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.part-head .pill{font-size:12px;font-weight:800;padding:4px 12px;border-radius:20px;letter-spacing:.03em}
.part-head h2{font-size:20px;font-weight:800;letter-spacing:-.01em}
.part-head .desc{font-size:13px;color:var(--faint);margin-left:auto;text-align:right}
.p1 .pill{background:rgba(99,102,241,.15);color:var(--ind2)}
.p2 .pill{background:rgba(52,211,153,.15);color:var(--grn)}
.p3 .pill{background:rgba(34,211,238,.15);color:var(--cyan)}
.p4 .pill{background:rgba(251,146,60,.15);color:var(--orange)}
.pb .pill{background:rgba(168,85,247,.15);color:var(--pur)}

.lecs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:14px}
.lec{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;transition:.2s;position:relative;overflow:hidden}
.lec.live{cursor:pointer}
.lec.live:hover{border-color:var(--accent,var(--grn));transform:translateY(-3px);box-shadow:var(--shadow)}
.lec.soon{opacity:.62;cursor:default}
.lec .num{font-family:ui-monospace,monospace;font-size:12px;color:var(--faint);font-weight:700}
.lec h3{font-size:16px;margin-top:6px;letter-spacing:-.01em}
.lec .one{font-size:12.5px;color:var(--dim);margin-top:8px;min-height:34px}
.lec .foot{display:flex;align-items:center;gap:8px;margin-top:12px}
.lec .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.lec .badge.live{background:var(--accent,var(--grn));color:#04221a}
.lec .badge.doc{background:var(--card2);color:var(--faint);border:1px solid var(--line)}
.lec .badge.killer{background:rgba(251,191,36,.16);color:var(--amber);border:1px solid rgba(251,191,36,.35)}
.lec .arrow{margin-left:auto;color:var(--faint);font-size:16px;transition:.2s}
.lec.live:hover .arrow{color:var(--accent,var(--grn));transform:translateX(3px)}
.lec .prog{margin-top:12px}
.lec .prog .mini{height:6px;background:var(--bg2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.lec .prog .mini i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--grn),var(--cyan));transition:.6s}
.lec .prog .lbl{font-size:10.5px;color:var(--faint);margin-top:4px;text-align:right;font-family:ui-monospace,monospace}
.lec .done-flag{position:absolute;top:12px;right:12px;font-size:12px;color:var(--grn);display:none}
.lec.complete .done-flag{display:block}
.lec.complete{border-color:rgba(52,211,153,.4)}

footer{padding:50px 0 70px;border-top:1px solid var(--line);text-align:center;margin-top:40px}
footer .cap{color:var(--faint);font-size:13px}
footer .reset{margin-top:14px;font-size:12px;color:var(--faint);background:none;border:1px solid var(--line);padding:6px 14px;border-radius:8px;cursor:pointer}
footer .reset:hover{border-color:var(--red);color:var(--red)}

@media(max-width:600px){.part-head .desc{display:none}header.hero{padding:90px 0 30px}}
</style>
</head>
<body>
<div id="bar"></div>
<nav><div class="wrap">
  <div class="logo">GameMath <b>강의</b></div>
  <div class="chips">
    <a class="chip" href="#p1">벡터 기초</a>
    <a class="chip" href="#p2">내적·외적</a>
    <a class="chip" href="#p3">좌표계·회전</a>
    <a class="chip" href="#p4">충돌·판정</a>
    <a class="chip" href="#pb">보너스</a>
  </div>
</div></nav>

<header class="hero"><div class="wrap">
  <span class="kicker">언리얼 C++ 클라이언트 개발자를 위한</span>
  <h1>게임 수학 <span class="g">강의 시리즈</span></h1>
  <p class="sub">공식 증명이 아니라 실제 게임 상황과 1:1로 붙여서 배우는 벡터 수학. 직접 눌러보고, 시뮬레이션하고, 면접 답변까지. 본강 8강 + 보너스.</p>
  <div class="overall">
    <div class="top"><span class="t">전체 학습 진행</span><span class="n" id="ovNum">0%</span></div>
    <div class="pbar"><i id="ovBar"></i></div>
    <div class="stats">
      <span>인터랙티브 <b id="ovLive">8</b> / 9강</span>
      <span>셀프체크 <b id="ovCheck">0</b> 항목 완료</span>
    </div>
  </div>
</div></header>

<div class="wrap" id="grid"></div>

<footer><div class="wrap">
  <div class="cap">게임 수학 강의 시리즈 · 언리얼 C++ 클라 개발자용 · 이직 대비 CS 복습</div>
  <button class="reset" id="resetAll">학습 진행 기록 초기화</button>
</div></footer>

<script>
var PARTS=[
  {id:'p1',cls:'p1',pill:'PART 1',title:'벡터 기초',desc:'게임 수학의 언어',accent:'var(--ind2)',lecs:[
    {n:1,t:'벡터란 무엇인가',one:'점을 드래그하며 위치·변위·방향 벡터의 차이를 확인한다.',file:'01강_벡터란_무엇인가.html',killer:'벡터 놀이터',checks:5,key:'gm01-check'},
    {n:2,t:'벡터의 크기와 정규화',one:'대각선 이동이 41% 빨라지는 버그로 정규화와 NaN 함정을 확인한다.',file:'02강_벡터의_크기와_정규화.html',killer:'대각선 이동 시뮬레이터',checks:5,key:'gm02-check'}
  ]},
  {id:'p2',cls:'p2',pill:'PART 2',title:'내적과 외적',desc:'면접에서 반드시 나온다',accent:'var(--grn)',lecs:[
    {n:3,t:'내적 (Dot Product)',one:'FOV 시뮬레이터로 각도·투영 개념을 직접 확인한다.',file:'03강_내적_Dot_Product.html',killer:'FOV 판정 시뮬레이터',checks:6,key:'gm03-check'},
    {n:4,t:'외적 (Cross Product)',one:'슬라이더로 타겟을 돌려보며 좌/우 판정 부호를 확인한다.',file:'04강_외적_Cross_Product.html',killer:'좌우 판정 시뮬레이터',checks:6,key:'gm04-check'}
  ]},
  {id:'p3',cls:'p3',pill:'PART 3',title:'좌표계와 회전',desc:'',accent:'var(--cyan)',lecs:[
    {n:5,t:'좌표계와 변환',one:'캐릭터를 움직이고 돌리며 월드/로컬 좌표와 변환 순서 버그를 확인한다.',file:'05강_좌표계와_변환.html',killer:'트랜스폼 놀이터',checks:6,key:'gm05-check'},
    {n:6,t:'Look-At — 회전값 구하기',one:'터렛 조준 시뮬레이터로 atan2와 atan의 차이를 확인한다.',file:'06강_Look_At_회전값_구하기.html',killer:'터렛 조준 시뮬레이터',checks:6,key:'gm06-check'}
  ]},
  {id:'p4',cls:'p4',pill:'PART 4',title:'충돌과 판정',desc:'실전에서 제일 많이 씀',accent:'var(--orange)',lecs:[
    {n:7,t:'충돌 감지 기초',one:'슬라이더로 도형을 움직여 구체·AABB 충돌을 직접 확인한다.',file:'07강_충돌_감지_기초.html',killer:'충돌 판정 플레이그라운드',checks:6,key:'gm07-check'},
    {n:8,t:'점과 다각형',one:'오목한 구역을 직접 클릭해 외적 부호법과 Ray Casting을 비교한다.',file:'08강_점과_다각형.html',killer:'다각형 클릭 판정기',checks:5,key:'gm08-check'}
  ]},
  {id:'pb',cls:'pb',pill:'BONUS',title:'면접 정리',desc:'',accent:'var(--pur)',lecs:[
    {n:'★',t:'클라 개발자 게임수학 면접 BEST 20',one:'20문항 모범답변 + 꼬리질문.'}
  ]}
];

var grid=document.getElementById('grid');
var totalChecks=0, doneChecks=0;

PARTS.forEach(function(p){
  var sec=document.createElement('section');sec.className='part '+p.cls;sec.id=p.id;
  var head='<div class="part-head"><span class="pill">'+p.pill+'</span><h2>'+p.title+'</h2>'+(p.desc?'<span class="desc">'+p.desc+'</span>':'')+'</div>';
  var lecs='<div class="lecs">';
  p.lecs.forEach(function(l){
    var live=!!l.file;
    var prog='';
    if(live && l.checks){
      var saved={};try{saved=JSON.parse(localStorage.getItem(l.key)||'{}');}catch(e){}
      var d=Object.keys(saved).filter(function(k){return saved[k];}).length;
      totalChecks+=l.checks;doneChecks+=Math.min(d,l.checks);
      var pct=Math.round(d/l.checks*100);
      var complete=d>=l.checks;
      prog='<div class="prog"><div class="mini"><i style="width:'+pct+'%"></i></div><div class="lbl">셀프체크 '+d+'/'+l.checks+'</div></div>';
      l._complete=complete;
    }
    var badges='';
    if(live){badges+='<span class="badge live">▶ 인터랙티브</span>';if(l.killer)badges+='<span class="badge killer">⚡ '+l.killer+'</span>';}
    else{badges+='<span class="badge doc">준비 중</span>';}
    var cls='lec '+(live?'live':'soon')+(l._complete?' complete':'');
    var tag=live?'a':'div';
    var attrs='class="'+cls+'"'+(live?' href="'+l.file+'"':'')+' style="--accent:'+p.accent+'"';
    lecs+='<'+tag+' '+attrs+'>'+
      '<span class="done-flag">✓ 완료</span>'+
      '<div class="num">'+(typeof l.n==='number'?String(l.n).padStart(2,'0')+'강':l.n)+'</div>'+
      '<h3>'+l.t+'</h3>'+
      '<div class="one">'+l.one+'</div>'+
      '<div class="foot">'+badges+(live?'<span class="arrow">→</span>':'')+'</div>'+
      prog+
      '</'+tag+'>';
  });
  lecs+='</div>';
  sec.innerHTML=head+lecs;grid.appendChild(sec);
});

(function(){
  var liveCount=0;PARTS.forEach(function(p){p.lecs.forEach(function(l){if(l.file)liveCount++;});});
  document.getElementById('ovLive').textContent=liveCount;
  document.getElementById('ovCheck').textContent=doneChecks;
  var pct=totalChecks?Math.round(doneChecks/totalChecks*100):0;
  document.getElementById('ovNum').textContent=pct+'%';
  setTimeout(function(){document.getElementById('ovBar').style.width=pct+'%';},200);
})();

document.getElementById('resetAll').addEventListener('click',function(){
  if(confirm('모든 강의의 셀프체크 진행 기록을 지울까요?')){
    PARTS.forEach(function(p){p.lecs.forEach(function(l){if(l.key)localStorage.removeItem(l.key);});});
    location.reload();
  }
});

(function(){
  var bar=document.getElementById('bar'),secs=[].slice.call(document.querySelectorAll('.part')),chips=[].slice.call(document.querySelectorAll('nav a.chip'));
  function onScroll(){var s=window.scrollY,h=document.documentElement.scrollHeight-window.innerHeight;
    bar.style.width=(h>0?s/h*100:0)+'%';
    var cur=0;for(var i=0;i<secs.length;i++){if(secs[i].getBoundingClientRect().top<160)cur=i;}
    chips.forEach(function(c,i){c.classList.toggle('on',i===cur);});}
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
})();
</script>
</body>
</html>
